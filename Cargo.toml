[package]
name = "sflowana"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "High-performance real-time Solana transaction and market-data engine"
repository = "https://github.com/jaferi/sflowana"

[dependencies]
async-trait = "0.1.92"
bs58 = "0.5.1"
dotenvy = "0.15.7"
serde_json = "1.0.151"
solana-client = "4.3.0"
solana-sdk = "5.0.0"
solana-transaction-status-client-types = "4.3.0"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
